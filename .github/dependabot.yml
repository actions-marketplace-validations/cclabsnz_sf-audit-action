version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised release has time to be
    # caught and pulled before it reaches this action's users.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
