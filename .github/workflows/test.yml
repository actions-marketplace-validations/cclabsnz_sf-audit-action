name: Test

# Runs the action against a throwaway Developer Edition org. This repository is public, so the
# runs publish no job summary and no artifacts, and stick to two checks whose results reveal
# nothing about the org beyond its Health Check score.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  passes-when-clean:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: audit
        uses: ./
        with:
          auth-url: ${{ secrets.SF_AUTH_URL }}
          checks: api-limits
          fail-on: CRITICAL
          job-summary: 'false'
          upload-artifact: 'false'
      - name: Check the outputs
        env:
          GRADE: ${{ steps.audit.outputs.grade }}
          SCORE: ${{ steps.audit.outputs.health-score }}
          CODE: ${{ steps.audit.outputs.exit-code }}
        run: |
          set -euo pipefail
          [[ "$GRADE" =~ ^[ABCDF]$ ]] || { echo "bad grade: $GRADE"; exit 1; }
          [[ "$SCORE" =~ ^[0-9]+$ ]] || { echo "bad score: $SCORE"; exit 1; }
          [ "$CODE" = "0" ] || { echo "expected exit 0, got $CODE"; exit 1; }

  fails-on-gate:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: audit
        uses: ./
        continue-on-error: true
        with:
          auth-url: ${{ secrets.SF_AUTH_URL }}
          checks: health-check
          fail-on: HIGH
          job-summary: 'false'
          upload-artifact: 'false'
      - name: Check the gate failed the step
        env:
          OUTCOME: ${{ steps.audit.outcome }}
          CODE: ${{ steps.audit.outputs.exit-code }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "expected the step to fail, got $OUTCOME"; exit 1; }
          [ "$CODE" = "1" ] || { echo "expected exit 1, got $CODE"; exit 1; }

  writes-summary-and-artifact:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # api-limits only: its result is API consumption, which says nothing about the org's
      # exposure, so it is safe to publish from this public repository.
      - id: audit
        uses: ./
        with:
          auth-url: ${{ secrets.SF_AUTH_URL }}
          checks: api-limits
          artifact-name: sf-audit-report-test
      # Each step gets its own summary file, so a later step cannot read what the action wrote.
      # Check the report the summary is built from, and that its digest renders.
      - name: Check the report and digest
        env:
          JSON: ${{ steps.audit.outputs.json-report }}
        run: |
          set -euo pipefail
          test -s "$JSON"
          jq -e '.grade and (.findings | length > 0)' "$JSON" > /dev/null
