name: Lint

# Static checks for the action and its workflows. The action handles org credentials, so script
# injection, credential persistence and unpinned actions are caught here before review.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "${RUNNER_TEMP}/${tarball}" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "${SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          # Fail the job on findings instead of uploading SARIF, which needs security-events: write.
          advanced-security: false
          annotations: true
          min-severity: low
